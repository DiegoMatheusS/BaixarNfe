                <div class="cte-inline"><span>TIPO DO SERVIÇO</span><b data-cte="service-type"></b></div>

            <section class="cte-center-column">

                <div class="cte-title"><strong>DACTE</strong><span>Documento Auxiliar do Conhecimento<br>de Transporte Eletrônico</span></div>

                <div class="cte-barcode" data-cte-slot="barcode"></div>
                <div class="cte-key-line">
                  <span>Chave de acesso para consulta de autenticidade no site www.cte.fazenda.gov.br</span>
                  <strong data-cte="access-key"></strong>

              </div>

            <section class="cte-qr" data-cte-slot="qr"></section>

              <span>INDICADOR DO CT-e GLOBALIZADO</span>

            </section>
            <section class="cte-party" data-cte-party="dispatcher">
              <div class="cte-party-title"><span>EXPEDIDOR</span><strong data-party="name"></strong></div>
              <div class="cte-party-address"><span>ENDEREÇO</span><b data-party="street"></b><span>BAIRRO</span><b data-party="district"></b></div>
              <div class="cte-party-meta"><span>MUNICÍPIO<b data-party="city"></b></span><span>CEP<b data-party="zip"></b></span><span>UF<b data-party="state"></b></span><span>CNPJ/CPF<b data-party="document"></b></span><span>INSCRIÇÃO ESTADUAL<b data-party="ie"></b></span><span>FONE<b data-party="phone"></b></span><span>PAÍS<b data-party="country"></b></span></div>

            <section class="cte-party" data-cte-party="receiver">

              <div class="cte-party-address"><span>ENDEREÇO</span><b data-party="street"></b><span>BAIRRO</span><b data-party="district"></b></div>
              <div class="cte-party-meta"><span>MUNICÍPIO<b data-party="city"></b></span><span>CEP<b data-party="zip"></b></span><span>UF<b data-party="state"></b></span><span>CNPJ/CPF<b data-party="document"></b></span><span>INSCRIÇÃO ESTADUAL<b data-party="ie"></b></span><span>FONE<b data-party="phone"></b></span><span>PAÍS<b data-party="country"></b></span></div>

              <div class="cte-doc-body" data-cte-slot="documents-left"></div>

            <div class="cte-doc-half">

          <div class="cte-section-title">OBSERVAÇÕES</div>

            <div class="cte-receipt-name"><span>NOME COMPLETO</span></div>
            <div class="cte-receipt-arrival"><span>CHEGADA DATA / HORA</span></div>
            <div class="cte-receipt-doc"><span>CPF/RG/DOC</span></div>
            <div class="cte-receipt-sign"><span>ASSINATURA / CARIMBO</span></div>
            <div class="cte-receipt-departure"><span>SAÍDA DATA / HORA</span></div>
          </section>
          <footer class="cte-footer">procurandodanfe.com.br</footer>
