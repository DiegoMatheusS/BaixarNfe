name: Publicar capas originais do ProcurandoDashboard

on:
  push:
    branches: [main]
    paths:
      - dashboard-capas.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-capas-dashboard
  cancel-in-progress: false

jobs:
  importar-capas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validar e extrair somente os WebP originais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("dashboard-capas.zip")
          if not archive.is_file():
              print("ZIP ausente; sem alterações.")
              raise SystemExit(0)
          dest = Path("procurandodashboard/capas")
          files = []
          with ZipFile(archive) as z:
              for member in z.infolist():
                  name = member.filename
                  if member.is_dir():
                      continue
                  # Aceita o ZIP já organizado e o ZIP original com a pasta dashboard_webp.
                  if name.startswith("procurandodashboard/capas/"):
                      basename = name[len("procurandodashboard/capas/"):]
                  elif name.startswith("dashboard_webp/"):
                      basename = name[len("dashboard_webp/"):]
                  elif name == "LEIA-ME.txt":
                      continue
                  else:
                      raise ValueError("Entrada inesperada no ZIP: " + name)
                  if not basename or "/" in basename or "\\" in basename or not basename.lower().endswith(".webp"):
                      raise ValueError("Nome de arquivo inseguro ou inválido: " + name)
                  files.append((member, basename))
              if len(files) != 206:
                  raise ValueError(f"Esperados 206 arquivos WebP; encontrados {len(files)}")
              dest.mkdir(parents=True, exist_ok=True)
              for member, basename in files:
                  (dest / basename).write_bytes(z.read(member))
          print(f"{len(files)} capas/prévias WebP restauradas em {dest}")
          PY
      - name: Commit e publicação das imagens
        run: |
          if [ ! -f dashboard-capas.zip ]; then
            exit 0
          fi
          rm dashboard-capas.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- dashboard-capas.zip procurandodashboard/capas
          if git diff --cached --quiet; then
            echo "Sem novas imagens."
            exit 0
          fi
          git commit -m "fix(dashboard): publicar 206 imagens WebP originais"
          git push origin HEAD:main
